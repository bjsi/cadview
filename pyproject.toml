[project]
name = "openworkshop"
version = "0.3.0"
description = "The workshop around build123d/CadQuery: a persistent live viewer with animations, a gallery, an agent's eyes, and PCB layout from the CAD (formerly cadview)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "ocp-tessellate>=3.4",
]

[project.optional-dependencies]
pcb = ["shapely>=2"]            # openworkshop.pcb: board outlines from build123d faces
dev = ["pytest", "gerbonara"]   # tests/pcb: the KiCad conformance suite (needs kicad-cli + KiCad libraries)

[project.scripts]
openworkshop = "openworkshop.server:main"
cadview = "openworkshop.server:main"        # pre-rename name

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["openworkshop", "cadview"]       # cadview = import shim for the old name

[tool.setuptools.package-data]
openworkshop = ["static/lite/*", "static/lite/vendor/*", "plugin/*"]
