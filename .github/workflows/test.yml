name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e . --no-deps && pip install aiohttp
      - run: python -m unittest discover -s tests -p "test_server.py" -v
      - run: python -m unittest discover -s tests -p "test_anim.py" -v
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check openworkshop/plugin/server.mjs

  pcb:
    # openworkshop.pcb conformance: library footprints, Gerber flashes, DRC round trip,
    # two open-source boards, JLC files — against a real kicad-cli + KiCad libraries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: KiCad (kicad-cli + footprint/symbol libraries)
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases   # 10: `pcb drc --refill-zones --save-board` re-serialises the board
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends kicad kicad-footprints kicad-symbols kicad-packages3d libgl1 libglu1-mesa
          kicad-cli version
      # build123d 0.10 = OCP 7.8, the stack the suite's OCP-level fixtures (TColgp arrays) and its consumer repos run on
      # ocp-gordon pinned too: 0.2+ pulls the OCP 8 proxy next to OCP 7.8 (no OCP.collections)
      - run: pip install -e ".[pcb,dev]" "build123d==0.10.0" "ocp-gordon==0.1.18"
      - run: python -m pytest tests/pcb -q -ra
