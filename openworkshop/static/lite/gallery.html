<!doctype html>
<!-- openworkshop gallery: every scene on this server, thumbnail + search.
     Thumbnails are posted by viewer pages as scenes get viewed/rebuilt; a
     card without one loads its scene in a hidden frame to make it. Designs
     from the project's openworkshop.json show as cards while they build. -->
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>openworkshop</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='2' width='12' height='12' rx='2' fill='%2388c0d0'/%3E%3C/svg%3E" />
    <style>
        html, body { margin: 0; background: #1b1f27; color: #d8dee9;
            font: 14px -apple-system, system-ui, sans-serif; }
        header { display: flex; align-items: center; gap: 14px;
            padding: 14px 18px 6px; }
        header h1 { font-size: 16px; margin: 0; font-weight: 650; }
        #q { flex: 1; max-width: 420px; height: 36px; border: 0; border-radius: 18px;
            padding: 0 16px; background: rgba(59, 66, 82, 0.9); color: #eceff4;
            font: 14px system-ui, sans-serif; outline: none; }
        #q::placeholder { color: #8b93a3; }
        #groups { padding: 4px 18px 24px; }
        .ghead { font-size: 12.5px; font-weight: 650; color: #8b93a3;
            text-transform: uppercase; letter-spacing: 0.06em;
            margin: 18px 2px 10px; }
        .ghead .n { font-weight: 400; margin-left: 6px; }
        .grid { display: grid; gap: 14px;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
        .card { background: rgba(37, 44, 58, 0.8); border-radius: 12px;
            overflow: hidden; cursor: pointer; text-decoration: none; color: inherit;
            transition: transform 0.08s, background 0.12s; }
        .card:hover { background: rgba(50, 60, 78, 0.9); transform: translateY(-2px); }
        .card.unbuilt { cursor: default; opacity: 0.75; }
        .card.unbuilt:hover { transform: none; background: rgba(37, 44, 58, 0.8); }
        .card .im { aspect-ratio: 16/10; background:
            linear-gradient(140deg, #232a38, #1d222d); display: flex;
            align-items: center; justify-content: center; position: relative; }
        .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .card .ph { color: #4c566a; }
        .card .st { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 12px;
            font-size: 11px; color: #a3abb8; background: rgba(27, 31, 39, 0.75); }
        .card .st.err { color: #d08770; white-space: pre-wrap; max-height: 60%;
            overflow: hidden; }
        .card .st.busy::before { content: ""; display: inline-block; width: 8px; height: 8px;
            border-radius: 50%; background: #ebcb8b; margin-right: 6px;
            animation: pulse 1.2s ease-in-out infinite; }
        @keyframes pulse { 50% { opacity: 0.25; } }
        .card .meta { padding: 9px 12px 11px; }
        .card .t { font-weight: 600; font-size: 13.5px; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis; }
        .card .s { font-size: 11px; color: #8b93a3; margin-top: 2px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #none { color: #8b93a3; padding: 30px 18px; display: none; }
        #thumber { position: fixed; left: -2000px; top: 0; width: 800px; height: 500px;
            border: 0; visibility: hidden; }
    </style>
</head>
<body>
    <header>
        <h1>openworkshop</h1>
        <input id="q" type="search" placeholder="search designs…" autofocus />
    </header>
    <div id="groups"></div>
    <div id="none">nothing matches</div>
    <script>
        const PH = '<svg class="ph" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.3 7 12 12 20.7 7"/><line x1="12" y1="22" x2="12" y2="12"/></svg>';
        let rows = [];
        let lastJson = "";
        let staticMode = false;     // true when fed by a baked scenes.json
        const groupsEl = document.getElementById("groups");
        const none = document.getElementById("none");
        const q = document.getElementById("q");
        const thumbUrl = (r) => `./thumbs/${encodeURIComponent(r.project)}.png?v=${encodeURIComponent(r.received_at || "")}`;

        function card(r) {
            const unbuilt = r.built === false;
            const a = document.createElement(unbuilt ? "div" : "a");
            a.className = "card" + (unbuilt ? " unbuilt" : "");
            // relative in both worlds: /<p> on a server, <site>/<p>/ static
            if (!unbuilt) a.href = "./" + encodeURIComponent(r.project) + (staticMode ? "/" : "");
            const im = document.createElement("div");
            im.className = "im";
            if (unbuilt) {
                im.innerHTML = PH;
                const st = document.createElement("div");
                st.className = "st" + (r.error ? " err" : r.building ? " busy" : "");
                st.textContent = r.error ? "failed: " + r.error.slice(-2).join("\n")
                    : r.building ? "building…" : r.queued ? "queued" : "not built";
                im.append(st);
            } else {
                const img = document.createElement("img");
                img.loading = "lazy";
                img.src = thumbUrl(r);
                img.onerror = () => { img.remove(); im.innerHTML = PH; wantThumb(r); };
                im.append(img);
            }
            const meta = document.createElement("div");
            meta.className = "meta";
            const t = document.createElement("div");
            t.className = "t";
            t.textContent = r.title || r.name || r.project;
            const s = document.createElement("div");
            s.className = "s";
            const when = (r.received_at || "").replace("T", " ").replace(/:\d\d[+-].*$/, "");
            s.textContent = [r.project, when].filter(Boolean).join(" · ");
            meta.append(t, s);
            a.append(im, meta);
            a.dataset.project = r.project;
            return a;
        }

        function render() {
            // one section per project folder — a fresh clone's server shows
            // exactly its own designs; multi-repo servers get headers
            const needle = q.value.trim().toLowerCase();
            groupsEl.textContent = "";
            const byGroup = new Map();
            for (const r of rows) {
                const hay = `${r.title || ""} ${r.name || ""} ${r.project} ${r.group || ""}`.toLowerCase();
                if (needle && !hay.includes(needle)) continue;
                const g = r.group || r.project;
                if (!byGroup.has(g)) byGroup.set(g, []);
                byGroup.get(g).push(r);
            }
            const groups = [...byGroup.entries()]
                .sort((a, b) => (b[1][0].received_at || "").localeCompare(a[1][0].received_at || ""));
            for (const [g, list] of groups) {
                if (groups.length > 1 || needle) {
                    const head = document.createElement("div");
                    head.className = "ghead";
                    head.textContent = g;
                    const n = document.createElement("span");
                    n.className = "n";
                    n.textContent = String(list.length);
                    head.append(n);
                    groupsEl.append(head);
                }
                const grid = document.createElement("div");
                grid.className = "grid";
                for (const r of list) grid.append(card(r));
                groupsEl.append(grid);
            }
            none.style.display = groups.length ? "none" : "block";
        }

        // ---- thumbnails for scenes nobody has opened yet: load each in a
        // hidden viewer frame, which posts its snapshot like any page --------
        const thumbQueue = [];
        let thumbing = null;
        function wantThumb(r) {
            if (staticMode || thumbQueue.some((x) => x.project === r.project) || thumbing === r.project) return;
            thumbQueue.push(r);
            nextThumb();
        }
        async function nextThumb() {
            if (thumbing || !thumbQueue.length) return;
            const r = thumbQueue.shift();
            thumbing = r.project;
            let frame = document.getElementById("thumber");
            if (!frame) {
                frame = document.createElement("iframe");
                frame.id = "thumber";
                document.body.append(frame);
            }
            frame.src = "./" + encodeURIComponent(r.project);
            const url = thumbUrl(r);
            for (let i = 0; i < 40; i++) {
                await new Promise((res) => setTimeout(res, 1000));
                try {
                    const head = await fetch(url, { method: "HEAD", cache: "no-store" });
                    if (head.ok) {
                        const cardEl = groupsEl.querySelector(`[data-project="${CSS.escape(r.project)}"] .im`);
                        if (cardEl) {
                            const img = document.createElement("img");
                            img.src = url;
                            cardEl.textContent = "";
                            cardEl.append(img);
                        }
                        break;
                    }
                } catch {}
            }
            frame.src = "about:blank";
            thumbing = null;
            nextThumb();
        }

        // ---- snapshots for agents: the server asks this open page to render a
        // scene in a hidden frame (GET /api/snapshot) — nothing visible changes
        function renderSnapshot(msg) {
            const params = new URLSearchParams({ snap: msg.id, ...(msg.params || {}) });
            const f = document.createElement("iframe");
            const w = +msg.params?.w || 1200, h = +msg.params?.h || 800;
            f.style.cssText = `position:fixed;left:-${w + 100}px;top:0;width:${w}px;height:${h}px;border:0;visibility:hidden`;
            f.src = "./" + encodeURIComponent(msg.name) + "?" + params;
            const done = (e) => {
                if (e.data?.openworkshopSnapDone !== msg.id) return;
                f.remove();
                window.removeEventListener("message", done);
            };
            window.addEventListener("message", done);
            setTimeout(() => { f.remove(); window.removeEventListener("message", done); }, 60000);
            document.body.append(f);
        }
        let listening = false;
        function listen() {
            if (staticMode) return;
            listening = true;
            let ws;
            try {
                ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws?role=renderer`);
            } catch { return; }
            ws.onmessage = (e) => {
                let m;
                try { m = JSON.parse(e.data); } catch { return; }
                if (m.type === "snapshot") renderSnapshot(m);
            };
            ws.onclose = () => setTimeout(listen, 3000);
        }

        // ---- data: a live server lists scenes; a static site bakes scenes.json
        async function load() {
            let d = null;
            try {
                const r = await fetch("/api/runnable", { cache: "no-store" });
                if (r.ok) d = await r.json();
            } catch {}
            if (!d) {
                try {
                    const r = await fetch("./scenes.json", { cache: "no-store" });
                    if (r.ok) { staticMode = true; d = await r.json(); }
                } catch {}
            }
            if (!d) {
                if (!rows.length) { none.textContent = "no server reachable"; none.style.display = "block"; }
                return;
            }
            if (!listening) listen();
            const json = JSON.stringify(d.projects || []);
            if (json !== lastJson) {
                lastJson = json;
                rows = d.projects || [];
                render();
            }
            // designs still building: keep the cards honest until they land
            if (rows.some((r) => r.built === false)) setTimeout(load, 3000);
        }
        q.addEventListener("input", render);
        load();
    </script>
</body>
</html>
