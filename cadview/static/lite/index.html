<!doctype html>
<!--
cadview lite — the buildless, dependency-light viewer core.
Rules: (1) static artifact — plain ES modules + pinned vendored three.js,
deployable on any static host; (2) progressive enhancement — a server adds
live updates, without one this is still a full viewer; (3) install is a URL.
-->
<html>
<head>
    <meta charset="utf-8" />
    <!--__CADVIEW_BASE__-->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>cadview lite</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='2' width='12' height='12' rx='2' fill='%2388c0d0'/%3E%3C/svg%3E" />
    <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
    <style>
        html, body {
            margin: 0; padding: 0; height: 100dvh; overflow: hidden;
            background: #f0f0f0; overscroll-behavior: none;
            font: 14px -apple-system, system-ui, sans-serif;
        }
        @media (prefers-color-scheme: dark) { html, body { background: #1b1f27; } }
        #view { position: fixed; inset: 0; touch-action: none; }
        #hud {
            position: fixed; left: 8px; top: 8px; z-index: 10;
            font-size: 11px; color: #888; background: rgba(128,128,128,0.12);
            border-radius: 6px; padding: 3px 8px; text-decoration: none;
            max-width: 70vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            display: inline-flex; align-items: center; gap: 5px;
        }
        #hud:hover { background: rgba(136, 192, 208, 0.22); color: #d8dee9; }
        #hud .home { color: #8b93a3; display: inline-flex; }
        #hud:hover .home { color: #88c0d0; }
        #hud .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
                    background: #c00; margin-right: 5px; vertical-align: 1px; }
        #hud.connected .dot { background: #2a2; }
        #traybtn {
            position: fixed; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom));
            z-index: 11; width: 48px; height: 48px; border: 0; border-radius: 24px;
            background: rgba(59, 66, 82, 0.92); color: #d8dee9;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; -webkit-tap-highlight-color: transparent;
        }
        #tray {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 12;
            max-height: 55dvh; overflow-y: auto; -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain; background: rgba(25, 31, 42, 0.96);
            backdrop-filter: blur(8px); border-radius: 14px 14px 0 0;
            padding: 4px 6px calc(8px + env(safe-area-inset-bottom));
            font: 15px/1.3 -apple-system, system-ui, sans-serif; color: #d8dee9;
        }
        #tray[hidden] { display: none; }
        #tray, #pickpanel, #selpanel {
            scrollbar-width: thin; scrollbar-color: rgba(136, 147, 163, 0.35) transparent; }
        #tray::-webkit-scrollbar, #pickpanel::-webkit-scrollbar, #selpanel::-webkit-scrollbar {
            width: 6px; }
        #tray::-webkit-scrollbar-track, #pickpanel::-webkit-scrollbar-track,
        #selpanel::-webkit-scrollbar-track { background: transparent; }
        #tray::-webkit-scrollbar-thumb, #pickpanel::-webkit-scrollbar-thumb,
        #selpanel::-webkit-scrollbar-thumb {
            background: rgba(136, 147, 163, 0.35); border-radius: 3px; }
        #tray .phead { display: flex; justify-content: space-between; align-items: center;
                       padding: 4px 10px 6px; color: #8b93a3; font-size: 12px; }
        #tray .phead button { border: 0; border-radius: 8px; padding: 8px 14px; margin-left: 6px;
                              background: #3b4252; color: #d8dee9; font: 600 13px system-ui, sans-serif; }
        #tray .prow { display: flex; align-items: center; gap: 8px; min-height: 44px;
                      padding: 0 6px; border-radius: 8px; -webkit-tap-highlight-color: transparent; }
        #tray .prow:active { background: rgba(136, 192, 208, 0.15); }
        #tray .pchev { width: 24px; text-align: center; color: #8b93a3; flex: 0 0 auto;
                       display: flex; align-items: center; justify-content: center; }
        #tray .pchev svg { transition: transform 0.12s; }
        #tray .pchev.open svg { transform: rotate(90deg); }
        #tray .peye { color: #aeb6c2; display: flex; align-items: center; justify-content: center; }
        #tray .prow.off .peye { color: #5c6370; }
        #tray .pswatch { width: 15px; height: 15px; border-radius: 4px; flex: 0 0 auto; }
        #tray .pname { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #tray .peye { flex: 0 0 auto; width: 44px; height: 44px; border: 0; background: none;
                      font-size: 19px; padding: 0; }
        #tray .prow.off .pname, #tray .prow.off .pswatch { opacity: 0.35; }
        /* wide screens: the tray docks top-left as a persistent parts tree
           (ocp-viewer style); phones keep the bottom sheet */
        @media (min-width: 600px) {
            #traybtn { display: none; }     /* the tree is a permanent dock */
            #tray {
                left: 8px; right: auto; top: 40px; bottom: auto;
                width: 320px; max-height: calc(100dvh - 180px);
                border-radius: 12px; font-size: 13px;
                background: rgba(25, 31, 42, 0.82);
                opacity: 0.45; transition: opacity 0.15s;
            }
            #tray:hover, #tray:focus-within { opacity: 1; }
            #tray .prow:hover { background: rgba(136, 192, 208, 0.1); }
            #tray .prow { min-height: 26px; gap: 6px; }
            #tray .peye { width: 26px; height: 26px; font-size: 14px; }
            #tray .pchev { width: 18px; }
            #tray .pswatch { width: 11px; height: 11px; }
            #tray .phead button { padding: 4px 10px; font-size: 12px; }
            #pickpanel { left: 8px; top: 40px; bottom: auto; }
        }
        #tray .prow.sel { background: rgba(29, 78, 216, 0.28); }
        #tray .prow.flash { animation: rowflash 1.6s ease-out; }
        @keyframes rowflash { 0%, 55% { background: rgba(136, 192, 208, 0.35); }
                              100% { background: transparent; } }
        #empty {
            position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
            color: #888; text-align: center; padding: 20px; z-index: 5;
        }
        #selpanel {
            position: fixed; left: 8px; right: 8px; top: 36px; z-index: 10;
            max-width: 440px; max-height: 38vh; overflow-y: auto;
            background: rgba(25, 31, 42, 0.92); backdrop-filter: blur(6px);
            border-radius: 10px; padding: 4px 6px; color: #d8dee9;
        }
        @media (min-width: 600px) {
            #selpanel { left: auto; right: 8px; top: 8px; width: 340px; }
        }
        #selpanel[hidden] { display: none; }
        #selpanel .selrow { display: flex; align-items: center; gap: 8px;
            padding: 5px 4px; border-bottom: 1px solid rgba(136, 147, 163, 0.15); }
        #selpanel .selrow:last-of-type { border-bottom: 0; }
        #selpanel .selbody { flex: 1; min-width: 0; }
        #selpanel .selname { font: 600 12.5px system-ui, sans-serif;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #selpanel .seltag { font: 600 10px system-ui, sans-serif; color: #88c0d0;
            background: rgba(136, 192, 208, 0.15); border-radius: 5px;
            padding: 1px 6px; margin-left: 6px; vertical-align: 1px; }
        #selpanel .seldet { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace;
            color: #8b93a3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #selpanel .selx { flex: 0 0 auto; width: 28px; height: 28px; border: 0;
            background: none; color: #8b93a3; font-size: 15px; cursor: pointer; padding: 0; }
        #selpanel .selmeas { padding: 6px 4px 2px; font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, monospace;
            color: #88c0d0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #selpanel .selclear { margin: 5px 4px 3px; border: 0; border-radius: 6px; padding: 4px 12px;
            background: #3b4252; color: #d8dee9; font: 600 11px system-ui, sans-serif; cursor: pointer; }
        #animbar {
            position: fixed; left: 50%; transform: translateX(-50%);
            bottom: calc(56px + env(safe-area-inset-bottom)); z-index: 11;
            display: flex; gap: 8px; align-items: center;
            width: min(420px, calc(100vw - 150px));
            background: rgba(25, 31, 42, 0.9); backdrop-filter: blur(6px);
            border-radius: 12px; padding: 6px 12px;
        }
        #animbar[hidden] { display: none; }
        #anim-play { width: 40px; height: 34px; border: 0; border-radius: 8px;
            background: #88c0d0; color: #2e3440; cursor: pointer;
            display: flex; align-items: center; justify-content: center; }
        #anim-scrub { flex: 1; accent-color: #88c0d0; }
        #anim-time { font: 11px ui-monospace, monospace; color: #8b93a3; min-width: 42px; text-align: right; }
        #anim-clear { font: 700 12px system-ui, sans-serif; color: #ff6b6b; cursor: help;
            display: flex; align-items: center; gap: 3px; }
        #anim-clear[hidden] { display: none; }
        #anim-clear-toggle { border: 0; border-radius: 8px; width: 30px; height: 26px; cursor: pointer;
            background: #3b4252; color: #ffb86c;
            display: flex; align-items: center; justify-content: center; }
        #anim-clear-toggle.off { opacity: 0.35; color: #8b93a3; }
        #anim-clear-toggle[hidden] { display: none; }
        #anim-rec { border: 0; border-radius: 8px; width: 30px; height: 26px; cursor: pointer;
            background: #3b4252; color: #d87070;
            display: flex; align-items: center; justify-content: center; }
        #anim-rec.rec { background: #bf616a; color: #fff; }
        #hud-run.ok { color: #a3be8c; }
        #hud-run.err { color: #bf616a; }
        #tray .phead button.active { background: #88c0d0; color: #2e3440; }
        #tray .phead button:disabled { opacity: 0.5; }
        #anim-clip { max-width: 110px; border: 0; border-radius: 8px; padding: 4px 6px;
            background: #3b4252; color: #d8dee9; font: 600 12px system-ui, sans-serif; }
        #anim-clip[hidden] { display: none; }
        #pickpanel {
            position: fixed; left: 8px; bottom: 70px; z-index: 13;
            max-height: 60dvh; width: min(340px, calc(100vw - 16px));
            overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
            background: rgba(25, 31, 42, 0.96); backdrop-filter: blur(8px);
            border-radius: 12px; padding: 6px;
            font: 14px/1.3 -apple-system, system-ui, sans-serif; color: #d8dee9;
        }
        #pickpanel[hidden] { display: none; }
        #pickpanel .pkrow { padding: 8px 10px; border-radius: 8px; cursor: pointer;
            -webkit-tap-highlight-color: transparent; }
        #pickpanel .pkrow:active, #pickpanel .pkrow:hover { background: rgba(136, 192, 208, 0.15); }
        #pickpanel .pkrow.current { background: rgba(136, 192, 208, 0.22); }
        #pickpanel .pkproj { font-weight: 600; }
        #pickpanel .pksub { font-size: 11px; color: #8b93a3;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #pickpanel .pkrun { float: right; color: #88c0d0; font-size: 12px; margin-left: 8px; }
        #empty[hidden] { display: none; }
        #gizmo { position: fixed; left: 8px; bottom: 8px; z-index: 10;
            width: 110px; height: 110px; cursor: pointer; }
        /* snapshot frames (?snap=…): just the model */
        .snap #hud, .snap #gizmo, .snap #animbar, .snap #tray, .snap #selpanel, .snap #empty { display: none !important; }
    </style>
</head>
<body>
    <div id="view"></div>
    <div id="empty">loading…</div>
    <canvas id="gizmo" width="110" height="110"></canvas>
    <a id="hud" href="/" title="all designs"><span class="home"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span><span class="dot"></span><span id="hud-text">connecting…</span><span id="hud-run"></span></a>
    <div id="pickpanel" hidden></div>
    <button id="traybtn" aria-label="parts"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></button>
    <div id="selpanel" hidden></div>
    <div id="animbar" hidden>
        <button id="anim-play"></button>
        <select id="anim-clip" hidden></select>
        <input id="anim-scrub" type="range" min="0" max="1" step="0.01" value="0" />
        <span id="anim-time">0.0s</span>
        <span id="anim-clear" hidden></span>
        <button id="anim-clear-toggle" hidden title="collision check on/off"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></button>
        <button id="anim-rec" title="record this clip as a video"><svg viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="7" fill="currentColor"/></svg></button>
    </div>
    <div id="tray" hidden></div>
    <script>
        // boot telemetry: embedded panes have no devtools, so startup
        // failures beacon back to the server (same origin, gated)
        (function () {
            var errs = [];
            function send(kind, msg) {
                try {
                    navigator.sendBeacon("/api/boot-error",
                        JSON.stringify({ kind: kind, msg: String(msg).slice(0, 500),
                                         ua: navigator.userAgent.slice(0, 200),
                                         gl: (function () { try { var c = document.createElement("canvas");
                                             return !!(c.getContext("webgl2") || c.getContext("webgl")); }
                                             catch (e) { return "throw:" + e.message; } })() }));
                } catch (e) { }
            }
            window.__bootErrs = errs;
            window.addEventListener("error", function (e) {
                errs.push(e.message || e.type);
                send("error", (e.filename || "") + ": " + (e.message || e.type));
            }, true);
            window.addEventListener("unhandledrejection", function (e) {
                errs.push(String(e.reason));
                send("rejection", e.reason);
            });
            window.__bootSend = send;
        })();
    </script>
    <script type="module" src="./lite.js"></script>
    <script>
        // if the module never boots (no WebGL, embedded webview, blocked
        // modules), say so instead of sitting on "loading…" forever
        setTimeout(function () {
            if (!window.cadviewLite) {
                window.__bootSend("watchdog", "module never booted; errs=" +
                    JSON.stringify(window.__bootErrs));
                var el = document.getElementById("empty");
                el.hidden = false;
                el.textContent = "The viewer couldn't start in this browser " +
                    "(it needs WebGL and ES modules — embedded panes often lack them). " +
                    "Open this URL in a regular browser tab.";
            }
        }, 7000);
    </script>
</body>
</html>
